services:
  citytourcabs:
    build:
      context: .
      dockerfile: Dockerfile
      # Public values only. Runtime secrets stay in `environment` below.
      args:
        NEXT_PUBLIC_SITE_URL: https://citytourcabs.in
        NEXT_PUBLIC_SERVER_URL: https://citytourcabs.in
        NEXT_PUBLIC_SITE_NAME: "City Tour Cabs"
        NEXT_PUBLIC_GADS_CONVERSION_LABEL: ${NEXT_PUBLIC_GADS_CONVERSION_LABEL:-4HTzCLqMl6cdENL8iIJF}
    image: citytourcabs:latest
    container_name: citytourcabs
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SITE_URL=https://citytourcabs.in
      - NEXT_PUBLIC_SITE_NAME=City Tour Cabs
      - NEXT_PUBLIC_SERVER_URL=https://citytourcabs.in
      # Required: PostgreSQL connection string (Supabase pooler in production).
      - DATABASE_URI=${DATABASE_URI:?Set DATABASE_URI to the PostgreSQL connection string}
      # Optional PEM CA bundle; setting it enables Postgres TLS verification.
      - DB_SSL_CA=${DB_SSL_CA:-}
      # Required: generate with `openssl rand -hex 32`. Never commit the value.
      - PAYLOAD_SECRET=${PAYLOAD_SECRET:?Set PAYLOAD_SECRET in the deployment environment}
      # Keep schema pushes disabled in production; use reviewed migrations instead.
      - DB_PUSH=${DB_PUSH:-false}
      - N8N_INTERNAL_URL=${N8N_INTERNAL_URL:-http://n8n:5678/webhook/booking-notification}
      - N8N_WEBHOOK_TOKEN=${N8N_WEBHOOK_TOKEN:-}
      - N8N_CHAT_WEBHOOK_URL=${N8N_CHAT_WEBHOOK_URL:-}
      - NEXT_PUBLIC_GADS_CONVERSION_LABEL=${NEXT_PUBLIC_GADS_CONVERSION_LABEL:-4HTzCLqMl6cdENL8iIJF}
    volumes:
      - media_storage:/app/public/media
    networks:
      - dokploy-network
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.citytourcabs-http.entrypoints=web"
      - "traefik.http.routers.citytourcabs-http.rule=Host(`citytourcabs.in`) || Host(`www.citytourcabs.in`) || Host(`cabs.kishorlab.dev`)"
      - "traefik.http.routers.citytourcabs-http.service=citytourcabs-svc"
      - "traefik.http.routers.citytourcabs-http.middlewares=redirect-to-https@file"
      - "traefik.http.routers.citytourcabs-https.entrypoints=websecure"
      - "traefik.http.routers.citytourcabs-https.rule=Host(`citytourcabs.in`) || Host(`www.citytourcabs.in`) || Host(`cabs.kishorlab.dev`)"
      - "traefik.http.routers.citytourcabs-https.service=citytourcabs-svc"
      - "traefik.http.routers.citytourcabs-https.tls=true"
      - "traefik.http.routers.citytourcabs-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.citytourcabs-svc.loadbalancer.server.port=3000"

volumes:
  media_storage:

networks:
  dokploy-network:
    external: true
  coolify:
    external: true

